<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>medk</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b14;color:#fff;height:100vh}
    .app{max-width:760px;margin:auto;height:100%;display:flex;flex-direction:column}
    header{padding:18px 18px 12px;border-bottom:1px solid #202638;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:21px;margin:0}.status{font-size:12px;color:#7ee2a8}
    #chat{flex:1;overflow:auto;padding:18px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;margin:10px 0;white-space:pre-wrap;line-height:1.45}
    .user{margin-left:auto;background:#315efb}.ai{background:#171d2d}.hint{color:#9aa4bb;text-align:center;margin-top:35vh}
    footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #202638;display:flex;gap:8px}
    textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:1px solid #2b3348;background:#111625;color:#fff;border-radius:16px;padding:12px;font:inherit;outline:none}
    button{border:0;border-radius:16px;background:#315efb;color:#fff;padding:0 15px;font-weight:700}.mic{background:#222a3d;width:50px;padding:0}
    button:disabled{opacity:.5}.typing{opacity:.65}
  </style>
</head>
<body>
<div class="app">
  <header><h1>medk</h1><span class="status" id="status">Ready</span></header>
  <main id="chat"><div class="hint" id="hint">Talk to medk<br><small>Type or use the microphone</small></div></main>
  <footer>
    <button class="mic" id="mic" title="Voice input">🎙️</button>
    <textarea id="input" placeholder="Message medk..." rows="1"></textarea>
    <button id="send">Send</button>
  </footer>
</div>
<script>
const chat=document.querySelector('#chat'), input=document.querySelector('#input'), send=document.querySelector('#send'), mic=document.querySelector('#mic'), status=document.querySelector('#status'), hint=document.querySelector('#hint');
let history=JSON.parse(localStorage.getItem('medk_history')||'[]');

function add(role,text){
  hint?.remove(); const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
history.forEach(m=>add(m.role==='user'?'user':'ai',m.content));

async function talk(){
  const text=input.value.trim(); if(!text)return;
  add('user',text); history.push({role:'user',content:text}); localStorage.setItem('medk_history',JSON.stringify(history));
  input.value=''; send.disabled=true; status.textContent='Thinking…';
  const t=document.createElement('div'); t.className='msg ai typing'; t.textContent='Thinking…'; chat.appendChild(t);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-30)})});
    const data=await r.json(); t.remove();
    if(!r.ok) throw new Error(data.error||'Request failed');
    add('ai',data.reply); history.push({role:'assistant',content:data.reply}); localStorage.setItem('medk_history',JSON.stringify(history));
    if('speechSynthesis' in window){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(data.reply); u.rate=.98; speechSynthesis.speak(u);}
    status.textContent='Ready';
  }catch(e){t.textContent='Error: '+e.message; status.textContent='Offline/error';}
  send.disabled=false;
}
send.onclick=talk; input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();talk();}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR(); rec.lang='en-US'; rec.interimResults=false;
  rec.onstart=()=>status.textContent='Listening…'; rec.onend=()=>status.textContent='Ready';
  rec.onresult=e=>{input.value=e.results[0][0].transcript; talk();};
  mic.onclick=()=>rec.start();
}else mic.disabled=true;
</script>
</body>
</html>
