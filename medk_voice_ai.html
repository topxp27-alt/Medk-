<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#070914"
  >

  <title>Medk — Voice AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #070914;
      color: #f5f7ff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(7,9,20,.88);

      backdrop-filter: blur(18px);

      position: sticky;
      top: 0;

      z-index: 5;
    }

    .brand {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .status {
      font-size: 14px;
      color: #98a4c3;
    }

    main {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        28px
        18px
        150px;
    }

    .orb-wrap {
      width: min(330px, 78vw);
      height: min(330px, 78vw);

      position: relative;

      display: grid;
      place-items: center;

      margin: 22px 0 26px;
    }

    .ring {
      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        1px solid rgba(88,105,255,.35);

      animation:
        spin 12s linear infinite;
    }

    .ring.two {
      inset: 18px;

      border-color:
        rgba(171,82,255,.25);

      animation-direction: reverse;

      animation-duration: 9s;
    }

    .orb {
      width: 63%;
      height: 63%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 28%,
          #8fa2ff 0%,
          #4b5dff 22%,
          #7d2cff 56%,
          #13162e 78%
        );

      box-shadow:
        0 0 35px rgba(80,90,255,.65),
        0 0 90px rgba(131,47,255,.3);

      position: relative;

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .orb:before,
    .orb:after {
      content: "";

      position: absolute;

      inset: 15%;

      border-radius: 50%;

      background:
        rgba(255,255,255,.12);

      filter: blur(16px);
    }

    .orb:after {
      inset:
        45%
        20%
        18%
        45%;

      background:
        rgba(255,255,255,.3);
    }

    .orb.listening {
      transform: scale(1.1);

      box-shadow:
        0 0 55px rgba(71,102,255,.9),
        0 0 130px rgba(158,47,255,.55);

      animation:
        breathe .9s ease-in-out infinite alternate;
    }

    .orb.thinking {
      animation:
        think 1s ease-in-out infinite alternate;
    }

    .hint {
      text-align: center;

      color: #aab3cf;

      font-size: 17px;

      margin-bottom: 18px;
    }

    .transcript {
      width: min(720px, 100%);

      min-height: 86px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        rgba(23,27,46,.8);

      border-radius: 22px;

      padding: 20px;

      color: #e8ebf7;

      line-height: 1.5;

      box-shadow:
        0 14px 40px rgba(0,0,0,.18);
    }

    .transcript.empty {
      color: #68718e;
    }

    .controls {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        16px
        18px
        calc(16px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          180deg,
          rgba(7,9,20,0),
          rgba(7,9,20,.96) 35%
        );

      display: flex;
      justify-content: center;

      z-index: 6;
    }

    button {
      border: 0;

      font: inherit;

      cursor: pointer;
    }

    #talk {
      width: min(680px, 100%);

      min-height: 64px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #435cff,
          #812bff
        );

      color: white;

      font-size: 18px;

      font-weight: 750;

      box-shadow:
        0 10px 35px rgba(77,63,255,.3);
    }

    #talk:active {
      transform: scale(.985);
    }

    #talk:disabled {
      opacity: .65;
    }

    .small {
      margin-top: 14px;

      font-size: 12px;

      color: #626c8b;

      text-align: center;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes breathe {
      to {
        transform: scale(1.16);
      }
    }

    @keyframes think {
      to {
        transform:
          scale(1.06)
          rotate(3deg);
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <header>

      <div class="brand">
        medk
      </div>

      <div
        class="status"
        id="status"
      >
        Ready
      </div>

    </header>

    <main>

      <div class="orb-wrap">

        <div class="ring"></div>

        <div class="ring two"></div>

        <div
          class="orb"
          id="orb"
        ></div>

      </div>

      <div
        class="hint"
        id="hint"
      >
        Tap the button and talk to Medk
      </div>

      <div
        class="transcript empty"
        id="transcript"
      >
        Your conversation will appear here.
      </div>

      <div class="small">
        Microphone permission is required for voice mode.
      </div>

    </main>

    <div class="controls">

      <button id="talk">
        🎙️ Tap to talk
      </button>

    </div>

  </div>


<script>

  const talk =
    document.getElementById("talk");

  const orb =
    document.getElementById("orb");

  const statusEl =
    document.getElementById("status");

  const hint =
    document.getElementById("hint");

  const transcript =
    document.getElementById("transcript");


  let stream = null;

  let recorder = null;

  let chunks = [];

  let recording = false;


  function setStatus(text) {
    statusEl.textContent = text;
  }


  function showText(text) {

    transcript.textContent = text;

    transcript.classList.remove("empty");

  }


  function pickMimeType() {

    const choices = [

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/mp4"

    ];

    return choices.find(
      t => MediaRecorder.isTypeSupported(t)
    ) || "";

  }


  async function startRecording() {

    if (!navigator.mediaDevices?.getUserMedia) {

      showText(
        "This browser does not provide microphone access. Open the site over HTTPS."
      );

      return;
    }


    try {

      stream =
        await navigator.mediaDevices.getUserMedia({

          audio: {

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

          }

        });


      chunks = [];


      const mimeType =
        pickMimeType();


      recorder = mimeType

        ? new MediaRecorder(
            stream,
            { mimeType }
          )

        : new MediaRecorder(stream);


      recorder.ondataavailable =
        e => {

          if (
            e.data &&
            e.data.size
          ) {

            chunks.push(e.data);

          }

        };


      recorder.onstop =
        sendRecording;


      recorder.start();


      recording = true;


      orb.classList.add(
        "listening"
      );


      talk.textContent =
        "⏹️ Tap to stop";


      setStatus(
        "Listening…"
      );


      hint.textContent =
        "I'm listening";


    } catch (err) {

      console.error(err);


      showText(
        "Microphone permission was denied or the microphone could not be opened."
      );


      setStatus(
        "Microphone unavailable"
      );

    }

  }


  function stopRecording() {

    if (
      !recorder ||
      recorder.state === "inactive"
    ) {

      return;

    }


    recorder.stop();


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      stream = null;

    }


    recording = false;


    orb.classList.remove(
      "listening"
    );

    orb.classList.add(
      "thinking"
    );


    talk.disabled = true;


    talk.textContent =
      "Thinking…";


    setStatus(
      "Thinking…"
    );


    hint.textContent =
      "Medk is thinking";

  }


  async function sendRecording() {

    try {

      const type =
        recorder?.mimeType ||
        "audio/webm";


      const blob =
        new Blob(
          chunks,
          { type }
        );


      const base64 =
        await blobToBase64(blob);


      const response =
        await fetch(
          "/api/voice",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                audio: base64,

                mimeType: type

              })

          }
        );


      const data =
        await response
          .json()
          .catch(
            () => ({})
          );


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Voice request failed."
        );

      }


      const reply =
        data.reply ||
        "I didn't catch that.";


      showText(reply);


      setStatus(
        "Ready"
      );


      hint.textContent =
        "Tap the button and talk to Medk";


      speak(reply);


    } catch (err) {

      console.error(err);


      showText(
        "Sorry, something went wrong: " +
        err.message
      );


      setStatus(
        "Error"
      );


      hint.textContent =
        "Tap the button to try again";


    } finally {

      orb.classList.remove(
        "thinking"
      );


      talk.disabled = false;


      talk.textContent =
        "🎙️ Tap to talk";

    }

  }


  function blobToBase64(blob) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onloadend =
          () => resolve(
            reader.result
          );


        reader.onerror =
          reject;


        reader.readAsDataURL(
          blob
        );

      }
    );

  }


  function speak(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.rate = 1.02;

    utterance.pitch = 1.0;

    utterance.volume = 1.0;


    const voices =
      window.speechSynthesis
        .getVoices();


    const english =
      voices.find(
        v => /^en/i.test(v.lang)
      );


    if (english) {

      utterance.voice =
        english;

    }


    window.speechSynthesis.speak(
      utterance
    );

  }


  talk.addEventListener(
    "click",
    () => {

      if (recording) {

        stopRecording();

      } else {

        startRecording();

      }

    }
  );


  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis
      .onvoiceschanged =
      () =>
        window.speechSynthesis
          .getVoices();

  }

</script>

</body>
</html>
