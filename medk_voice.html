<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>medk</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh}.app{max-width:760px;margin:auto;height:100%;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #202638;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}.status{font-size:12px;color:#8ea0bd}#chat{flex:1;overflow:auto;padding:18px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{margin-left:auto;background:#315efb}.ai{background:#171d2d}.hint{text-align:center;color:#9aa4bb;margin-top:35vh}footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #202638;display:flex;gap:8px}textarea{flex:1;resize:none;min-height:48px;max-height:120px;border:1px solid #2b3348;background:#111625;color:#fff;border-radius:16px;padding:12px;font:inherit;outline:none}button{border:0;border-radius:16px;background:#315efb;color:#fff;padding:0 15px;font-weight:700}.mic{width:52px;padding:0;background:#222a3d;font-size:20px}.listening{background:#b42318}.small{font-size:12px;color:#9aa4bb}</style></head><body><div class="app"><header><h1>medk</h1><span class="status" id="status">Ready</span></header><main id="chat"><div class="hint" id="hint">Talk to medk<br><span class="small">Tap 🎙️ and speak</span></div></main><footer><button class="mic" id="mic" aria-label="Voice input">🎙️</button><textarea id="input" placeholder="Message medk..." rows="1"></textarea><button id="send">Send</button></footer></div><script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),mic=document.getElementById("mic"),status=document.getElementById("status");
let history=JSON.parse(localStorage.getItem("medk_history")||"[]");
function add(role,text){const h=document.getElementById("hint");if(h)h.remove();const d=document.createElement("div");d.className="msg "+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
history.forEach(m=>add(m.role==="user"?"user":"ai",m.content));
function speak(text){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.98;setTimeout(()=>speechSynthesis.speak(u),100)}
async function talk(){const text=input.value.trim();if(!text||send.disabled)return;add("user",text);history.push({role:"user",content:text});localStorage.setItem("medk_history",JSON.stringify(history));input.value="";send.disabled=true;mic.disabled=true;status.textContent="Thinking…";const d=document.createElement("div");d.className="msg ai";d.textContent="Thinking…";chat.appendChild(d);try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-20)})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");d.textContent=data.reply;history.push({role:"assistant",content:data.reply});localStorage.setItem("medk_history",JSON.stringify(history));speak(data.reply);status.textContent="Ready"}catch(e){d.textContent="Error: "+e.message;status.textContent="Connection error"}send.disabled=false;mic.disabled=false}
send.onclick=talk;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();talk()}});
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(Recognition){const rec=new Recognition();rec.lang="en-US";rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{mic.classList.add("listening");mic.textContent="⏹️";status.textContent="Listening…"};rec.onend=()=>{mic.classList.remove("listening");mic.textContent="🎙️";if(!send.disabled)status.textContent="Ready"};rec.onerror=e=>{mic.classList.remove("listening");mic.textContent="🎙️";status.textContent=e.error==="not-allowed"?"Microphone permission denied":"Voice error"};rec.onresult=e=>{input.value=e.results[0][0].transcript;talk()};mic.onclick=()=>{try{rec.start()}catch(e){}}}else{mic.disabled=true}
</script></body></html>
